<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon AI Battle</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="battle-scene">
            <div class="opponent-side">
                <div class="status-box">
                    <h2 id="p2-name">Opponent</h2>
                    <div class="hp-bar-container">
                        <div id="p2-hp-bar" class="hp-bar"></div>
                    </div>
                    <span id="p2-hp-text">100/100</span>
                </div>
                <div class="sprite-container">
                    <img id="p2-sprite" src="" alt="">
                </div>
            </div>

            <div class="player-side">
                <div class="sprite-container">
                    <img id="p1-sprite" src="" alt="">
                </div>
                <div class="status-box">
                    <h2 id="p1-name">Player</h2>
                    <div class="hp-bar-container">
                        <div id="p1-hp-bar" class="hp-bar"></div>
                    </div>
                    <span id="p1-hp-text">100/100</span>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="log-panel" id="log-panel">
                <!-- Battle logs go here -->
            </div>
            
            <div class="controls-panel">
                <div id="loading" class="loading hidden">Waiting for AI...</div>
                <div id="actions-container">
                    <!-- Action buttons go here -->
                </div>
                <div id="game-over" class="hidden">
                    <h2 id="winner-text"></h2>
                    <button onclick="resetGame()" class="action-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
